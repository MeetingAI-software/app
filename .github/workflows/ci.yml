name: CI

# Day 6 §3: the robot makes "forgot to run tests" structurally impossible.
# Runs on every PR and every push to main; mark both jobs as required checks on main.
on:
  pull_request:
  push:
    branches: [main]
  # Manual trigger. Also the recovery path when Actions is degraded: during the 2026-08-06 outage a
  # merge produced no run at all, and there was nothing to re-run because nothing was ever created.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: Supply chain and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Scan versioned files for high-confidence secrets
        run: npm run security:secrets
      - name: Block high or critical dependency advisories
        run: npm audit --audit-level=high

  api:
    name: API (test + typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck --workspace api
      - name: Test
        run: npm run test --workspace api
      - name: Build
        run: npm run build --workspace api

  web:
    name: Web (test + typecheck + lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      # The web suite exists to catch client/server drift — constants that mirror an API value and
      # silently stop matching it. Unrun, those tests are decoration: the resend backoff drifted
      # from the server's limiter and no build here ever went red.
      - name: Test
        run: npm run test --workspace web
      - name: Typecheck
        run: npm run typecheck --workspace web
      - name: Lint
        run: npm run lint --workspace web
      # Keep the production build as a separate gate: it catches route/config and bundling errors
      # that plain TypeScript and ESLint do not exercise.
      - name: Build
        run: npm run build --workspace web

  # Ships the API on every merge to main, the way Vercel already ships the web app. The API is
  # deployed by CLI upload rather than Railway's GitHub integration, because that integration
  # cannot run migrations before the new code serves traffic and cannot wait for the tests.
  deploy:
    name: Deploy API to Railway
    needs: [api, web, security]            # never deploy code the tests/security gates have not passed
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    # Job-level so pull request runs are not serialised behind each other. Queue deploys rather
    # than cancelling: a cancelled deploy would silently skip a merge that is already on main.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"
      # Installs devDependencies too, which is where tsx lives — db:migrate needs it.
      - run: npm ci
      - name: Install Railway CLI
        run: npm i -g @railway/cli@5.30.1

      # --skip-deploys matters: setting a variable normally triggers its own redeploy, which would
      # race the real one below and could leave the older image serving the newer commit label.
      - name: Stamp the commit
        run: railway variables set --service api --environment production --skip-deploys "GIT_COMMIT=${{ github.sha }}"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      # Migrations run BEFORE the deploy, so new code never meets an old schema. This runs on the
      # runner with production variables injected. Keep it as `npm -w api`: that sets the working
      # directory to apps/api, which is what makes migrate.ts's relative `migrationsFolder:
      # 'drizzle'` resolve. A failure here stops the job with the previous version still serving.
      - name: Migrate
        run: railway run --service api --environment production -- npm run db:migrate -w api
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deploy
        # Railway occasionally rejects a CLI upload while creating its repository snapshot, before
        # the build has started. Retry that idempotent upload a few times; the commit stamp and
        # migration have already completed, and the SHA health check below still decides success.
        # Do not enable shell tracing here: deployment commands run with production credentials.
        timeout-minutes: 20
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            echo "Railway deploy attempt $attempt/3"
            if railway up --service api --environment production --ci; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 15))
              echo "::warning::Railway deploy attempt $attempt failed; retrying in ${delay}s"
              sleep "$delay"
            fi
          done

          echo "::error::Railway deployment failed after 3 attempts; inspect the deployment URL printed above"
          exit 1

      # Poll for the exact merged SHA, not just a 200 — the previous build answers 200 as well, so
      # status alone cannot tell "deployed" apart from "still running yesterday's code".
      - name: Verify the merged commit is serving
        run: |
          for i in $(seq 1 30); do
            got=$(curl -sf https://api.syncmemos.com/healthz \
              | python3 -c 'import sys,json;print(json.load(sys.stdin).get("commit",""))' 2>/dev/null || true)
            if [ "$got" = "${{ github.sha }}" ]; then
              echo "live: $got"
              exit 0
            fi
            echo "attempt $i/30: serving '$got'"
            sleep 10
          done
          echo "::error::API never reported ${{ github.sha }} after 5 minutes"
          exit 1
